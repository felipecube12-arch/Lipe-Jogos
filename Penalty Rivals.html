<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>⚽ PENALTY DUEL - GOLEIRO HUMANO + DEFESA FÁCIL</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #0a3d1a, #031a06);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Arial Black', system-ui;
            padding: 20px;
        }

        .game-container {
            background: linear-gradient(145deg, #c99e4f, #a06e2a);
            padding: 20px;
            border-radius: 48px;
            box-shadow: 0 25px 35px rgba(0,0,0,0.6), inset 0 1px 3px rgba(255,250,180,0.8);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 24px;
            box-shadow: 0 12px 20px rgba(0,0,0,0.4);
            cursor: pointer;
            background: #1a6e2f;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            margin-bottom: 12px;
            background: #0f2315dd;
            backdrop-filter: blur(8px);
            padding: 8px 18px;
            border-radius: 50px;
            flex-wrap: wrap;
        }

        .score-panel {
            background: #1a2f0e;
            padding: 5px 20px;
            border-radius: 35px;
            text-align: center;
        }

        .score-label {
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: #ffde9e;
        }

        .score-value {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffdd77;
            font-family: monospace;
            line-height: 1;
        }

        .turn-indicator {
            background: #2a2418;
            padding: 5px 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .message-box {
            background: #000000aa;
            padding: 6px 15px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #ffefb9;
            flex: 1;
            text-align: center;
        }

        button {
            background: #ffcd6b;
            border: none;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.8rem;
            padding: 6px 18px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.07s linear;
            color: #1e3a1a;
            box-shadow: 0 3px 0 #9b5e1a;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #9b5e1a;
        }

        .controls-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
            font-size: 0.65rem;
            background: #00000088;
            padding: 5px 15px;
            border-radius: 40px;
            color: #ffe1a0;
            flex-wrap: wrap;
        }

        .key {
            background: #1e1e1e;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            color: #ffbe3c;
            font-family: monospace;
        }

        .power-bar-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            height: 35px;
            background: #333;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid gold;
            z-index: 100;
        }

        .power-bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.01s linear;
        }

        .power-green { background: linear-gradient(90deg, #00cc44, #55ff88); }
        .power-yellow { background: linear-gradient(90deg, #ddcc00, #ffee55); }
        .power-red { background: linear-gradient(90deg, #cc3300, #ff6644); }

        .defense-buttons {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: #000000aa;
            padding: 10px 20px;
            border-radius: 60px;
            backdrop-filter: blur(8px);
            z-index: 100;
        }

        .defense-btn {
            background: #ffcd6b;
            border: none;
            font-size: 1.5rem;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 3px 0 #9b5e1a;
            transition: 0.05s linear;
        }

        .defense-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #9b5e1a;
        }

        @media (max-width: 750px) {
            .score-value { font-size: 1.3rem; }
            .message-box { font-size: 0.65rem; }
            .defense-btn { font-size: 1rem; padding: 5px 12px; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gameCanvas" width="950" height="550" style="width:100%; height:auto; max-width:950px; aspect-ratio:950/550"></canvas>
        <div class="top-bar">
            <div class="score-panel">
                <div class="score-label">🏆 PLACAR</div>
                <div class="score-value" id="scoreDisplay">0 - 0</div>
            </div>
            <div class="turn-indicator">
                🎮 <span class="shield" id="turnText">BATENDO</span>
            </div>
            <button id="resetGame">🔄 NOVO JOGO</button>
        </div>
        <div class="message-box" id="gameMsg">
            🎯 Clique ou ESPAÇO para parar a seta!
        </div>
        <div class="controls-info">
            <span>🎯 <span class="key">ESPAÇO/CLIQUE</span> = parar seta</span>
            <span>⚡ <span class="key">CLIQUE NOVAMENTE</span> = definir força</span>
            <span>🧤 <span class="key">BOTÕES NA TELA</span> = defender</span>
            <span>🎨 <span class="key" style="background:#00cc44;">VERDE</span> = fraco | <span class="key" style="background:#ddcc00;">AMARELO</span> = médio | <span class="key" style="background:#cc3300;">VERMELHO</span> = forte</span>
        </div>
    </div>
    <div id="powerBarContainer" class="power-bar-container" style="display: none;">
        <div id="powerBarFill" class="power-bar-fill power-green"></div>
    </div>
    <div id="defenseButtons" class="defense-buttons" style="display: none;">
        <button class="defense-btn" data-defend="up">⬆️ CIMA</button>
        <button class="defense-btn" data-defend="down">⬇️ BAIXO</button>
        <button class="defense-btn" data-defend="left">⬅️ ESQUERDA</button>
        <button class="defense-btn" data-defend="right">➡️ DIREITA</button>
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 950, H = 550;
        canvas.width = W;
        canvas.height = H;

        const scoreDisplaySpan = document.getElementById('scoreDisplay');
        const turnTextSpan = document.getElementById('turnText');
        const msgDiv = document.getElementById('gameMsg');
        const powerBarContainer = document.getElementById('powerBarContainer');
        const powerBarFill = document.getElementById('powerBarFill');
        const defenseButtonsDiv = document.getElementById('defenseButtons');

        // Time
        const teamColor = "#d81b1b";
        const teamColor2 = "#ffffff";

        // Dimensões do gol (MENOR)
        const GOAL = {
            leftPost: 280, rightPost: W - 280,
            topCross: 120, bottomY: H - 130
        };
        GOAL.centerX = (GOAL.leftPost + GOAL.rightPost) / 2;
        GOAL.centerY = (GOAL.topCross + GOAL.bottomY) / 2;

        const SHOOTER = { x: W/2, y: H - 80 };
        let keeperX = GOAL.centerX, keeperY = GOAL.centerY;
        let keeperDive = { active: false, targetX: GOAL.centerX, targetY: GOAL.centerY, progress: 0 };
        
        // Estado do jogo
        let playerScore = 0, aiScore = 0;
        let currentTurn = "player";
        let actionLock = false;
        
        // FASE DE ATAQUE
        let attackPhase = "aiming";
        let arrowAngle = 0;
        let arrowSpeed = 0.04;
        let selectedDirection = { x: 0, y: 0 };
        let powerValue = 0;
        let powerIncreasing = true;
        let powerInterval = null;
        
        // FASE DE DEFESA
        let defensePhase = false;
        let defenseDirection = null;
        let aiChuteDir = { x: 0, y: 0 };
        let aiPowerValue = 50;
        let defenseSpeed = 50;
        let defenseSpeedInterval = null;
        let defenseLock = false;
        
        // Animação da bola
        let ballAnim = { active: false, x: SHOOTER.x, y: SHOOTER.y, targetX: 0, targetY: 0, progress: 0 };
        
        // Animação do goleiro pular
        function animateKeeperDive(targetX, targetY) {
            keeperDive.active = true;
            keeperDive.targetX = targetX;
            keeperDive.targetY = targetY;
            keeperDive.progress = 0;
        }
        
        function updateKeeperDive() {
            if(keeperDive.active) {
                keeperDive.progress += 0.12;
                if(keeperDive.progress >= 1) {
                    keeperDive.active = false;
                    keeperX = GOAL.centerX;
                    keeperY = GOAL.centerY;
                } else {
                    let t = Math.sin(keeperDive.progress * Math.PI / 2);
                    keeperX = GOAL.centerX + (keeperDive.targetX - GOAL.centerX) * t;
                    keeperY = GOAL.centerY + (keeperDive.targetY - GOAL.centerY) * t;
                }
            } else {
                // Retorno suave ao centro
                keeperX += (GOAL.centerX - keeperX) * 0.1;
                keeperY += (GOAL.centerY - keeperY) * 0.1;
            }
        }
        
        function updateUI() {
            scoreDisplaySpan.innerText = `${playerScore} - ${aiScore}`;
            turnTextSpan.innerText = currentTurn === "player" ? "⚽ BATENDO" : "🧤 DEFENDENDO";
        }
        
        function setMessage(msg, isError = false) {
            msgDiv.innerHTML = msg;
            setTimeout(() => {
                if(!actionLock && attackPhase !== "power" && !defensePhase) {
                    if(currentTurn === "player") msgDiv.innerHTML = "🎯 ESPAÇO/CLIQUE para parar a seta!";
                    else msgDiv.innerHTML = "🧤 Clique no BOTÃO para defender!";
                }
            }, 2000);
        }
        
        // Inicia ataque do jogador
        function startPlayerAttack() {
            attackPhase = "aiming";
            arrowAngle = 0;
            powerValue = 0;
            powerIncreasing = true;
            defensePhase = false;
            actionLock = false;
            defenseButtonsDiv.style.display = "none";
            powerBarContainer.style.display = "none";
            setMessage("🎯 Gire a seta! Clique ou ESPAÇO para definir DIREÇÃO!");
            drawGame();
        }
        
        function stopArrow() {
            if(currentTurn !== "player") return;
            if(attackPhase === "aiming" && !actionLock) {
                selectedDirection = { x: Math.cos(arrowAngle), y: Math.sin(arrowAngle) };
                attackPhase = "power";
                powerValue = 0;
                powerIncreasing = true;
                powerBarContainer.style.display = "block";
                if(powerInterval) clearInterval(powerInterval);
                powerInterval = setInterval(() => {
                    if(attackPhase === "power") {
                        if(powerIncreasing) {
                            powerValue += 2.5;
                            if(powerValue >= 100) { powerValue = 100; powerIncreasing = false; }
                        } else {
                            powerValue -= 2.5;
                            if(powerValue <= 0) { powerValue = 0; powerIncreasing = true; }
                        }
                        let percent = powerValue;
                        powerBarFill.style.width = percent + "%";
                        if(powerValue < 40) powerBarFill.className = "power-bar-fill power-green";
                        else if(powerValue < 75) powerBarFill.className = "power-bar-fill power-yellow";
                        else powerBarFill.className = "power-bar-fill power-red";
                        drawGame();
                    }
                }, 20);
                setMessage("⚡ Clique ou ESPAÇO novamente para CHUTAR!");
                drawGame();
            } else if(attackPhase === "power" && !actionLock) {
                if(powerInterval) clearInterval(powerInterval);
                powerBarContainer.style.display = "none";
                executeShot();
            }
        }
        
        function executeShot() {
            actionLock = true;
            attackPhase = "none";
            
            let power = powerValue;
            let dir = selectedDirection;
            
            let rangeX = (GOAL.rightPost - GOAL.leftPost) / 2.2;
            let rangeY = (GOAL.bottomY - GOAL.topCross) / 2.2;
            let targetX = GOAL.centerX + dir.x * rangeX;
            let targetY = GOAL.centerY + dir.y * rangeY;
            targetX = Math.min(GOAL.rightPost - 15, Math.max(GOAL.leftPost + 15, targetX));
            targetY = Math.min(GOAL.bottomY - 15, Math.max(GOAL.topCross + 15, targetY));
            
            let isGoal = false;
            let resultMsg = "";
            
            // GOLEIRO TENTA DEFENDER (movimento humano)
            let goleiroAcertou = false;
            let goleiroMoveX = targetX + (Math.random() - 0.5) * 45;
            let goleiroMoveY = targetY + (Math.random() - 0.5) * 40;
            goleiroMoveX = Math.min(GOAL.rightPost - 20, Math.max(GOAL.leftPost + 20, goleiroMoveX));
            goleiroMoveY = Math.min(GOAL.bottomY - 25, Math.max(GOAL.topCross + 25, goleiroMoveY));
            animateKeeperDive(goleiroMoveX, goleiroMoveY);
            
            let distanciaDefesa = Math.hypot(goleiroMoveX - targetX, goleiroMoveY - targetY);
            let chanceDefesa = 0;
            
            if(power < 30) {
                chanceDefesa = 0.8;
                resultMsg = "🧤 Chute fraco! Goleiro defendeu!";
            } else if(power >= 30 && power < 50) {
                chanceDefesa = 0.5;
                resultMsg = "⚽ Chute médio! Goleiro quase pegou! GOL!";
            } else if(power >= 50 && power <= 75) {
                chanceDefesa = 0.2;
                resultMsg = "⚽ Chute perfeito! GOL!";
            } else if(power > 75 && power <= 90) {
                chanceDefesa = 0.3;
                resultMsg = "⚽ Chute forte! GOL!";
            } else {
                chanceDefesa = 0.1;
                resultMsg = "💨 MUITO FORTE! Bola foi pra fora!";
            }
            
            if(power > 90) {
                isGoal = false;
                resultMsg = "💨 Estourou! Bola foi PRA FORA!";
            } else {
                let defendeu = (distanciaDefesa < 45 && Math.random() < chanceDefesa);
                if(defendeu) {
                    isGoal = false;
                    resultMsg = "🧤 GOLEIRO DEFENDEU! Pulou no lugar certo!";
                } else {
                    isGoal = true;
                }
            }
            
            if(isGoal) playerScore++;
            updateUI();
            setMessage(resultMsg);
            
            ballAnim.active = true;
            ballAnim.x = SHOOTER.x;
            ballAnim.y = SHOOTER.y;
            ballAnim.targetX = targetX;
            ballAnim.targetY = targetY;
            ballAnim.progress = 0;
            
            setTimeout(() => {
                ballAnim.active = false;
                currentTurn = "ai";
                updateUI();
                startAIDefense();
                actionLock = false;
                drawGame();
            }, 700);
        }
        
        function startAIDefense() {
            defensePhase = true;
            defenseLock = false;
            actionLock = false;
            
            // Adversário escolhe direção aleatória
            let aiAngle = Math.random() * Math.PI * 2;
            aiChuteDir = { x: Math.cos(aiAngle), y: Math.sin(aiAngle) };
            
            // Força do adversário (aleatória)
            aiPowerValue = 40 + Math.random() * 50;
            
            // Mostra botões de defesa
            defenseButtonsDiv.style.display = "flex";
            
            // Mostra para onde o adversário vai chutar
            let dirText = "";
            if(aiChuteDir.x < -0.5) dirText = "⬅️ ESQUERDA";
            else if(aiChuteDir.x > 0.5) dirText = "➡️ DIREITA";
            else if(aiChuteDir.y < -0.5) dirText = "⬆️ CIMA";
            else if(aiChuteDir.y > 0.5) dirText = "⬇️ BAIXO";
            else dirText = "🎯 CENTRO";
            
            setMessage(`🧤 ADVERSÁRIO vai chutar: ${dirText}! Escolha o lado para defender!`);
            
            drawGame();
        }
        
        function playerDefend(direction) {
            if(!defensePhase || defenseLock || actionLock) return;
            
            defenseLock = true;
            defenseButtonsDiv.style.display = "none";
            
            let defDir = { x: 0, y: 0 };
            switch(direction) {
                case "up": defDir = { x: 0, y: -1 }; break;
                case "down": defDir = { x: 0, y: 1 }; break;
                case "left": defDir = { x: -1, y: 0 }; break;
                case "right": defDir = { x: 1, y: 0 }; break;
                default: return;
            }
            
            // Verifica se acertou a direção do chute
            let acertouDirecao = (Math.abs(defDir.x - aiChuteDir.x) < 0.7 && Math.abs(defDir.y - aiChuteDir.y) < 0.7);
            
            // Calcula posição do chute do adversário
            let rangeX = (GOAL.rightPost - GOAL.leftPost) / 2.2;
            let rangeY = (GOAL.bottomY - GOAL.topCross) / 2.2;
            let aiTargetX = GOAL.centerX + aiChuteDir.x * rangeX;
            let aiTargetY = GOAL.centerY + aiChuteDir.y * rangeY;
            aiTargetX = Math.min(GOAL.rightPost - 15, Math.max(GOAL.leftPost + 15, aiTargetX));
            aiTargetY = Math.min(GOAL.bottomY - 15, Math.max(GOAL.topCross + 15, aiTargetY));
            
            // Animação do goleiro pulando
            let puloX = aiTargetX + (Math.random() - 0.5) * 30;
            let puloY = aiTargetY + (Math.random() - 0.5) * 30;
            puloX = Math.min(GOAL.rightPost - 20, Math.max(GOAL.leftPost + 20, puloX));
            puloY = Math.min(GOAL.bottomY - 25, Math.max(GOAL.topCross + 25, puloY));
            animateKeeperDive(puloX, puloY);
            
            // Verifica defesa
            let defendeu = false;
            let resultMsg = "";
            
            // Força do chute do adversário influencia
            let forcaAI = aiPowerValue;
            
            if(acertouDirecao) {
                if(forcaAI < 40) {
                    defendeu = true;
                    resultMsg = "🧤 DEFENDEU! Chute fraco, você acertou o lado!";
                } else if(forcaAI <= 70) {
                    defendeu = Math.random() > 0.3;
                    resultMsg = defendeu ? "🧤 DEFENDEU! Você acertou o lado!" : "😭 GOL! Chute no seu lado mas foi forte demais!";
                } else {
                    defendeu = Math.random() > 0.6;
                    resultMsg = defendeu ? "🧤 DEFESAÇA! Mesmo forte, você pegou!" : "😭 GOL! Chute muito forte no seu lado!";
                }
            } else {
                defendeu = false;
                resultMsg = `😭 Você defendeu para ${direction} mas o chute foi para OUTRO LADO! GOL do adversário!`;
            }
            
            if(!defendeu) {
                aiScore++;
            }
            
            updateUI();
            setMessage(resultMsg);
            
            // Animação da bola
            ballAnim.active = true;
            ballAnim.x = SHOOTER.x;
            ballAnim.y = SHOOTER.y;
            ballAnim.targetX = aiTargetX;
            ballAnim.targetY = aiTargetY;
            ballAnim.progress = 0;
            
            setTimeout(() => {
                ballAnim.active = false;
                defensePhase = false;
                currentTurn = "player";
                updateUI();
                startPlayerAttack();
                drawGame();
            }, 700);
        }
        
        function resetGame() {
            if(powerInterval) clearInterval(powerInterval);
            playerScore = 0;
            aiScore = 0;
            currentTurn = "player";
            actionLock = false;
            defensePhase = false;
            defenseButtonsDiv.style.display = "none";
            powerBarContainer.style.display = "none";
            keeperDive.active = false;
            keeperX = GOAL.centerX;
            keeperY = GOAL.centerY;
            updateUI();
            startPlayerAttack();
            setMessage("🏆 NOVO JOGO! Use ESPAÇO para parar a seta e chutar!");
            drawGame();
        }
        
        function drawGame() {
            ctx.clearRect(0, 0, W, H);
            updateKeeperDive();
            
            // Gramado
            ctx.fillStyle = "#2b8c3e";
            ctx.fillRect(0, 0, W, H);
            
            ctx.strokeStyle = "#ffffffaa";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(W/2, 0);
            ctx.lineTo(W/2, H);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(W/2, H/2, 50, 0, 2*Math.PI);
            ctx.stroke();
            
            // Área do gol
            ctx.fillStyle = "#3ca055";
            ctx.fillRect(0, GOAL.topCross-20, W, GOAL.bottomY - GOAL.topCross + 40);
            ctx.fillStyle = "#1a3a1a";
            ctx.fillRect(GOAL.leftPost, GOAL.topCross, GOAL.rightPost - GOAL.leftPost, GOAL.bottomY - GOAL.topCross);
            
            // Rede
            ctx.strokeStyle = "#8bc47a";
            ctx.lineWidth = 1.5;
            for(let i = 0; i <= 5; i++) {
                let y = GOAL.topCross + ((GOAL.bottomY - GOAL.topCross) / 5) * i;
                ctx.beginPath();
                ctx.moveTo(GOAL.leftPost, y);
                ctx.lineTo(GOAL.rightPost, y);
                ctx.stroke();
            }
            for(let i = 0; i <= 6; i++) {
                let x = GOAL.leftPost + ((GOAL.rightPost - GOAL.leftPost) / 6) * i;
                ctx.beginPath();
                ctx.moveTo(x, GOAL.topCross);
                ctx.lineTo(x, GOAL.bottomY);
                ctx.stroke();
            }
            
            // Traves
            ctx.lineWidth = 8;
            ctx.strokeStyle = "#e8c47a";
            ctx.strokeRect(GOAL.leftPost, GOAL.topCross, GOAL.rightPost - GOAL.leftPost, GOAL.bottomY - GOAL.topCross);
            
            // GOLEIRO HUMANO (com rosto e expressão)
            ctx.fillStyle = teamColor2;
            ctx.beginPath();
            ctx.ellipse(keeperX, keeperY, 32, 42, 0, 0, Math.PI*2);
            ctx.fill();
            // Cabeça
            ctx.fillStyle = "#fdd7a8";
            ctx.beginPath();
            ctx.arc(keeperX, keeperY - 22, 16, 0, 2*Math.PI);
            ctx.fill();
            // Cabelo
            ctx.fillStyle = "#4a2a1a";
            ctx.beginPath();
            ctx.ellipse(keeperX, keeperY - 32, 14, 8, 0, 0, Math.PI*2);
            ctx.fill();
            // Olhos (expressão tensa)
            ctx.fillStyle = "#2a2b2e";
            ctx.beginPath();
            ctx.arc(keeperX - 7, keeperY - 26, 3.5, 0, 2*Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(keeperX + 7, keeperY - 26, 3.5, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(keeperX - 8, keeperY - 27, 1.2, 0, 2*Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(keeperX + 6, keeperY - 27, 1.2, 0, 2*Math.PI);
            ctx.fill();
            // Sobrancelhas (concentrado)
            ctx.beginPath();
            ctx.moveTo(keeperX - 12, keeperY - 31);
            ctx.lineTo(keeperX - 3, keeperY - 30);
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(keeperX + 12, keeperY - 31);
            ctx.lineTo(keeperX + 3, keeperY - 30);
            ctx.stroke();
            // Boca séria
            ctx.beginPath();
            ctx.arc(keeperX, keeperY - 18, 5, 0.1, Math.PI - 0.1);
            ctx.stroke();
            // Luvas
            ctx.fillStyle = "#d45e2b";
            ctx.beginPath();
            ctx.ellipse(keeperX - 20, keeperY + 6, 12, 9, -0.3, 0, 2*Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(keeperX + 20, keeperY + 6, 12, 9, 0.3, 0, 2*Math.PI);
            ctx.fill();
            // Nome "GOLEIRO" no peito
            ctx.font = "bold 10px monospace";
            ctx.fillStyle = "#333";
            ctx.fillText("🧤", keeperX - 8, keeperY + 5);
            
            // BATEDOR
            ctx.fillStyle = teamColor;
            ctx.beginPath();
            ctx.ellipse(SHOOTER.x, SHOOTER.y, 36, 46, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#fdd7a8";
            ctx.beginPath();
            ctx.arc(SHOOTER.x, SHOOTER.y - 24, 17, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = "#2a2b2e";
            ctx.beginPath();
            ctx.arc(SHOOTER.x - 6, SHOOTER.y - 28, 3.5, 0, 2*Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(SHOOTER.x + 6, SHOOTER.y - 28, 3.5, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(SHOOTER.x - 5, SHOOTER.y - 29, 1.5, 0, 2*Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(SHOOTER.x + 7, SHOOTER.y - 29, 1.5, 0, 2*Math.PI);
            ctx.fill();
            // Número na camisa
            ctx.fillStyle = "white";
            ctx.font = "bold 16px monospace";
            ctx.fillText("9", SHOOTER.x - 7, SHOOTER.y - 5);
            // Perna de chute
            ctx.fillStyle = teamColor;
            ctx.fillRect(SHOOTER.x + 10, SHOOTER.y + 4, 16, 12);
            
            // SETA GIRATÓRIA (fase de mira)
            if(currentTurn === "player" && attackPhase === "aiming" && !actionLock) {
                let arrowX = GOAL.centerX + Math.cos(arrowAngle) * 75;
                let arrowY = GOAL.centerY + Math.sin(arrowAngle) * 60;
                ctx.beginPath();
                ctx.moveTo(arrowX, arrowY);
                ctx.lineTo(arrowX - 18, arrowY - 10);
                ctx.lineTo(arrowX - 7, arrowY);
                ctx.fillStyle = "#ffaa44";
                ctx.fill();
                ctx.beginPath();
                ctx.arc(arrowX, arrowY, 10, 0, 2*Math.PI);
                ctx.fillStyle = "#ffdd88";
                ctx.fill();
                ctx.fillStyle = "#cc6600";
                ctx.font = "bold 16px monospace";
                ctx.fillText("⬆️", arrowX - 6, arrowY - 8);
                arrowAngle += arrowSpeed;
                if(arrowAngle > Math.PI * 2) arrowAngle -= Math.PI * 2;
            }
            
            // Indicador de direção da defesa
            if(defensePhase && currentTurn === "ai") {
                ctx.font = "bold 24px monospace";
                ctx.fillStyle = "#ffffaa";
                ctx.shadowBlur = 3;
                let dirText = "";
                if(aiChuteDir.x < -0.5) dirText = "⬅️ ESQUERDA";
                else if(aiChuteDir.x > 0.5) dirText = "➡️ DIREITA";
                else if(aiChuteDir.y < -0.5) dirText = "⬆️ CIMA";
                else if(aiChuteDir.y > 0.5) dirText = "⬇️ BAIXO";
                else dirText = "🎯 CENTRO";
                ctx.fillText("⚽ " + dirText + " ⚽", W/2 - 100, 55);
                ctx.font = "bold 14px monospace";
                ctx.fillStyle = "#aaffaa";
                ctx.fillText("Clique no BOTÃO abaixo para defender!", W/2 - 150, H - 55);
                ctx.shadowBlur = 0;
            }
            
            // Bola
            if(ballAnim.active) {
                let t = Math.min(1, ballAnim.progress + 0.1);
                ballAnim.progress = t;
                let bx = ballAnim.x + (ballAnim.targetX - ballAnim.x) * t;
                let by = ballAnim.y + (ballAnim.targetY - ballAnim.y) * t;
                ctx.beginPath();
                ctx.arc(bx, by, 18, 0, 2*Math.PI);
                ctx.fillStyle = "#f5f1c6";
                ctx.fill();
                ctx.fillStyle = "#333";
                ctx.beginPath();
                ctx.rect(bx-4, by-4, 8, 8);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(bx-12, by);
                ctx.lineTo(bx+12, by);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(bx, by-12);
                ctx.lineTo(bx, by+12);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.arc(SHOOTER.x - 14, SHOOTER.y + 4, 18, 0, 2*Math.PI);
                ctx.fillStyle = "#f5f1c6";
                ctx.fill();
                ctx.fillStyle = "#333";
                ctx.beginPath();
                ctx.rect(SHOOTER.x - 18, SHOOTER.y, 8, 8);
                ctx.fill();
            }
            
            // Placar
            ctx.font = "bold 40px monospace";
            ctx.fillStyle = "#fff3bf";
            ctx.shadowBlur = 3;
            ctx.fillText(`${playerScore}`, W/2 - 65, 70);
            ctx.fillText(`${aiScore}`, W/2 + 35, 70);
            ctx.shadowBlur = 0;
        }
        
        // Eventos
        window.addEventListener('keydown', (e) => {
            if(e.code === 'Space') {
                e.preventDefault();
                if(currentTurn === "player" && (attackPhase === "aiming" || attackPhase === "power")) {
                    stopArrow();
                }
            }
        });
        
        canvas.addEventListener('click', (e) => {
            if(currentTurn === "player" && (attackPhase === "aiming" || attackPhase === "power") && !actionLock) {
                stopArrow();
            }
        });
        
        // Botões de defesa
        document.querySelectorAll('.defense-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const direction = btn.getAttribute('data-defend');
                if(defensePhase && currentTurn === "ai" && !actionLock && !defenseLock) {
                    playerDefend(direction);
                }
            });
        });
        
        document.getElementById('resetGame').addEventListener('click', resetGame);
        
        setInterval(drawGame, 30);
        resetGame();
    })();
</script>
</body>
</html>
